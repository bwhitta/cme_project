<!DOCTYPE html>
<html>

<head>
  <title>Braden Whittaker's CME Project</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/poly-decomp@0.2.1/build/decomp.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@2.0.0/dist/opentype.min.js"></script>
  <script src="libraries/p5.js"></script>
  <script src="libraries/matter.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Noto+Sans:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:wght@400;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="main-content">
    <input type="range" id="control1" min="0" max="1" step="0.01" />
    <input type="range" id="control2" min="0" max="1" step="0.01" />
    <input type="range" id="control3" min="0" max="1" step="0.01" />
    <input type="range" id="control4" min="0" max="1" step="0.01" />
    <div class="mesh-wrap" id="mesh-wrap"><!-- p5.js canvas will be created in here --></div>
    <p>Modern UI</p>
    <div class="modern-ui-wrap">
      <button class="modern-button">Typography</button>
      <div class="button-row">
        <button class="modern-button">Typography</button>
        <button class="modern-button">Typography</button>
      </div>
    </div>
    <div class="crank-wrap">
      <div class="crank-handle" id="crank-handle"></div>
    </div>
    <p>Semi-Modern UI</p>
    <div class="waveform-wrap" id="waveform-wrap">
      <!-- p5.js canvas will be created in here -->
      <div class="mid-ui-wrap draggable-div" id="waveform-drag">
        <p class="mid-text">Drag windows to move them</p>
        <div class="mid-content-wrap" style="padding:0px">
          <div class="masking-div" id="waveform-mask">
          </div>
        </div>
      </div>
      <div class="mid-ui-wrap draggable-div" style="z-index: 0;" id="waveform-buttons">
        <p class="mid-text">Waveform Options</p>
        <div class="mid-content-wrap">
          <div class="button-column">
            <button class="mid-button" id="waveform-toggle-control-points">Control Points</button>
            <button class="mid-button" id="waveform-toggle-clipping">Toggle Clipping</button>
          </div>
        </div>
      </div>
    </div>
    <p>Older UI design</p>
    <p>Early command line stuff</p>
    <p>Typewriters/linotype/printing presses</p>
    <div class="letter-pile-area">
      <div id="matter-letters-wrap"><!-- Matter.js canvas will be created in here --></div>
    </div>
    <p>Illuminated manuscripts</p>
  </div>
  <script type="module" src="scripts/functionality.js"></script>
</body>

</html>
